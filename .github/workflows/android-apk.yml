# Compile l'APK Android installable de VEILLE MATINALE à chaque envoi sur GitHub.
# Résultat : onglet « Actions » › dernière exécution › « Artifacts » › veille-matinale-apk.
name: APK Android

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Dépendances
        run: npm ci

      - name: Vérification TypeScript
        run: npx tsc --noEmit

      - name: Tests (moteur solaire, programme, statistiques)
        run: npm test

      - name: Génération du projet Android natif
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Compilation de l'APK (release)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/release/app-release.apk veille-matinale.apk

      - uses: actions/upload-artifact@v4
        with:
          name: veille-matinale-apk
          path: veille-matinale.apk

      - name: Publier l'APK (sur les tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: veille-matinale.apk
